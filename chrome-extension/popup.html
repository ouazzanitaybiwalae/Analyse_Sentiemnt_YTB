<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>YouTube Sentiment</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Sentiment des commentaires</h1>
    <button id="themeBtn" class="icon" title="Changer de thème" aria-label="Changer de thème">◐</button>
  </header>

  <section id="controls">
    <div class="row">
      <label>Commentaires
        <select id="maxSel"><option>50</option><option selected>100</option><option>200</option><option>500</option></select>
      </label>
      <label>Serveur
        <select id="apiSel"><option value="cloud">Cloud</option><option value="local">Local</option></select>
      </label>
    </div>
    <label class="check"><input type="checkbox" id="repliesChk"> Inclure les réponses visibles</label>
    <button id="analyzeBtn" class="primary">Analyser cette vidéo</button>
  </section>

  <section id="status" hidden></section>

  <section id="results" hidden>
    <div class="hero">
      <div class="big"><span id="topPct">0</span><small>%</small></div>
      <div class="bigLabel" id="topLabel">positifs</div>
    </div>
    <div class="bar" id="bar" role="img" aria-label="Répartition des sentiments"></div>
    <ul class="legend" id="legend"></ul>
    <p class="meta" id="meta"></p>

    <div class="filters" id="filters">
      <button data-f="all" class="chip active">Tous</button>
      <button data-f="positive" class="chip">Positifs</button>
      <button data-f="neutral" class="chip">Neutres</button>
      <button data-f="negative" class="chip">Négatifs</button>
    </div>
    <ul id="list"></ul>
    <button id="moreBtn" class="ghost" hidden>Afficher plus</button>

    <div class="row actions">
      <button id="copyBtn" class="ghost">Copier les résultats</button>
      <button id="csvBtn" class="ghost">Exporter en CSV</button>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
